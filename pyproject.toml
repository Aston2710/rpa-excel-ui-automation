[project]
name = "rpa-excel-ui-automation"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "merzamac", email = "100945727+merzamac@users.noreply.github.com"},
]
dependencies = ["pywinauto>=0.6.9"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
bot = "python -m rpa_excel_ui_automation"
test = "pytest -q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
